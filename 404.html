<style>
/* Self-contained on purpose: GitHub Pages serves this file from ANY wrong address, so it must not depend on relative paths. */
:root{--ink:#e9edff;--mut:#9aa6c8;--line:#9fb4ff2b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#02030a}
body{min-height:100svh;color:var(--ink);font-family:Inter,"Segoe UI",system-ui,"IBM Plex Sans Arabic",Tahoma,sans-serif;font-weight:300;display:grid;place-items:center;text-align:center;overflow:hidden;position:relative;padding:2rem 1.2rem}
/* space: nebula + twinkling stars + shooting stars (same look as the portfolio) */
.sky{position:fixed;inset:0;z-index:0;background:
 radial-gradient(60% 50% at 18% 28%,#2a2f7a55,transparent 70%),radial-gradient(55% 45% at 82% 72%,#4a1f7a40,transparent 70%),radial-gradient(40% 35% at 70% 18%,#1b4aa044,transparent 70%),#02030a}
.stars,.stars::after{position:absolute;inset:0;content:"";background-repeat:repeat}
.stars{background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 34% 72%,#cfd9ff,transparent),radial-gradient(1.4px 1.4px at 58% 26%,#fff,transparent),radial-gradient(1px 1px at 76% 58%,#dfe6ff,transparent),radial-gradient(1.2px 1.2px at 90% 14%,#fff,transparent),radial-gradient(1px 1px at 22% 90%,#cfd9ff,transparent),radial-gradient(1px 1px at 66% 86%,#fff,transparent);background-size:420px 420px;animation:tw 6s ease-in-out infinite}
.stars::after{background-image:radial-gradient(1px 1px at 8% 52%,#fff,transparent),radial-gradient(1.4px 1.4px at 46% 8%,#dfe6ff,transparent),radial-gradient(1px 1px at 82% 38%,#fff,transparent),radial-gradient(1.2px 1.2px at 40% 46%,#cfd9ff,transparent),radial-gradient(1px 1px at 94% 90%,#fff,transparent);background-size:300px 300px;animation:tw 9s ease-in-out -3s infinite}
@keyframes tw{50%{opacity:.45}}
.shoot{position:fixed;z-index:1;width:140px;height:1.5px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(-28deg);opacity:0;animation:sh 9s linear infinite}
.shoot.a{top:14%;left:62%}.shoot.b{top:36%;left:8%;animation-delay:4.5s;width:110px}
@keyframes sh{0%{opacity:0;translate:0 0}3%{opacity:.9}14%{opacity:0;translate:-340px 180px}100%{opacity:0;translate:-340px 180px}}
body::before{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000b 100%)}
/* content */
main{position:relative;z-index:3;display:grid;justify-items:center;gap:1.1rem;max-width:560px}
.emb{position:relative;width:clamp(120px,22vw,168px);aspect-ratio:1;display:grid;place-items:center;margin-bottom:.4rem}
.emb img{position:relative;z-index:2;width:100%;display:block;filter:drop-shadow(0 0 34px #4a63e066);animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.emb svg{position:absolute;inset:-70%;width:240%;height:240%;overflow:visible;pointer-events:none}
.emb .r{fill:none;stroke:#cfdcff;transform-origin:600px 600px;animation:rot 38s linear infinite}
.emb .r2{animation-duration:56s;animation-direction:reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.code{font-size:clamp(4.2rem,17vw,8.5rem);font-weight:700;line-height:.95;letter-spacing:.04em;background:linear-gradient(180deg,#fff,#9fb0d8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.kick{font-size:.7rem;letter-spacing:.42em;color:var(--mut);text-transform:uppercase}
h1{font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:300;letter-spacing:.04em}
p{color:var(--mut);line-height:1.7;font-size:.95rem}
.ar{direction:rtl;font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;display:grid;gap:.35rem;margin-top:.2rem;padding-top:1.1rem;border-top:1px solid var(--line);width:min(100%,360px)}
.ar h2{font-size:1.25rem;font-weight:400;color:var(--ink)}.ar p{font-size:1rem}
.btn{display:inline-flex;align-items:center;gap:.7rem;margin-top:.9rem;padding:.8rem 1.7rem;border:1px solid var(--line);border-radius:99px;background:#ffffff0a;color:var(--ink);text-decoration:none;font-size:.9rem;backdrop-filter:blur(8px);transition:background .7s,transform .8s cubic-bezier(.2,.8,.2,1),border-color .7s}
.btn:hover{background:#4a63e0aa;border-color:#9fb4ff77;transform:translateY(-2px)}
.btn span+span{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;opacity:.85;padding-inline-start:.7rem;border-inline-start:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
